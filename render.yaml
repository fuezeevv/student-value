# Creates paid resources. Review pricing and approve in Render before applying.
# Secrets are generated by Render or injected from its database, never stored here.
previews:
  generation: off
services:
  - type: web
    name: studentvalue1984
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: bash scripts/render-build.sh
    preDeployCommand: npm run db:migrate:production
    startCommand: npm run start:production
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    domains:
      - studentvalue1984.eu.cc
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://studentvalue1984.eu.cc
      - key: ALLOW_DEV_AUTH
        value: "false"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: TZ
        value: Europe/Moscow
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: studentvalue1984-db
          property: connectionString

databases:
  - name: studentvalue1984-db
    databaseName: studentvalue1984
    user: studentvalue1984
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []
