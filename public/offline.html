<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Value · без сети</title><style>body{font:16px system-ui;background:#0b1a2d;color:#e6eef8;max-width:540px;margin:12vh auto;padding:24px}a{display:block;color:#9ed9ed;padding:16px 0;border-bottom:1px solid #35445c}p{line-height:1.6;color:#b8c5d8}</style><h1>Расписание под рукой</h1><p>Соединение недоступно. Здесь — ранее открытые общие страницы. Изменения без сети не сохраняются.</p><div id="pages"></div><p id="empty">Пока нет сохранённых страниц. При подключении откройте свою группу без входа — она сохранится на устройстве.</p><a href="/login">Повторить подключение</a><script>caches.open('sv-public-v1').then(async c=>{const keys=await c.keys();for(const k of keys){const u=new URL(k.url);if(!u.pathname.startsWith('/browse/'))continue;const a=document.createElement('a');a.href=u.href;const date=(await c.match(k)).headers.get('x-sv-saved');a.textContent=u.pathname.replace('/browse/','Группа ').replaceAll('/',' · ')+(date?' · копия '+new Date(date).toLocaleString('ru-RU'):'');document.querySelector('#pages').append(a);document.querySelector('#empty').hidden=true}})</script></html>
